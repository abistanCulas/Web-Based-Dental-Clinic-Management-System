# ===== Server =====
server.port=8080

# ===== H2 in-memory database =====
# No installation or setup needed - data resets every time the app restarts.
# Swap this block for a real MySQL/Postgres datasource later if you need
# data to persist between runs (see README.md for the MySQL version).
spring.datasource.url=jdbc:h2:mem:dentaflow_reports;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Browser-based DB viewer at http://localhost:8080/h2-console
# JDBC URL to paste in: jdbc:h2:mem:dentaflow_reports
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Jackson =====
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

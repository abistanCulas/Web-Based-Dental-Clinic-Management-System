# Server Configuration
server.port=8080

# Database Configuration (MySQL)
# NOTE: Update the password below to match your local MySQL root password
spring.datasource.url=jdbc:mysql://localhost:3306/dental_clinic_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate (Hibernate 6 automatically creates and updates tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=dentalClinicSecretKey2026SecureLongJwtKeyAtLeast256BitsForSignature
app.jwt.expiration=86400000

# Supplier Security Passcode Key
app.supplier.security-key=DENTAL-SUPPLIER-KEY-2026

# Logging
logging.level.com.dental=INFO

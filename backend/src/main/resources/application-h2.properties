# Server Configuration
server.port=8080

# In-memory H2 database (Zero setup required)
spring.datasource.url=jdbc:h2:mem:dental_clinic_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=dentalClinicSecretKey2026SecureLongJwtKeyAtLeast256BitsForSignature
app.jwt.expiration=86400000

# Supplier Security Passcode Key
app.supplier.security-key=DENTAL-SUPPLIER-KEY-2026

# Logging
logging.level.com.dental=INFO
